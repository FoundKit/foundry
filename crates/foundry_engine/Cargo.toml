[package]
name = "foundry_engine"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = ["postgres"]
postgres = ["foundry_storage/postgres"]
mysql = ["foundry_storage/mysql"]
mariadb = ["foundry_storage/mariadb"]
mongodb = ["foundry_storage/mongodb"]

[dependencies]
foundry_core = { workspace = true }
foundry_storage = { workspace = true, default-features = false }
foundry_auth = { workspace = true }
foundry_extension = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
validator = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
rust-embed = "8.12"
mime_guess = "2.0"
http-body-util = "0.1"
bytes = "1.10"
lettre = { version = "0.11.23", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }
fastrand = "2.3"
redis = { workspace = true }

[dev-dependencies]
sqlx = { workspace = true }
