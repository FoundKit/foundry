<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#f97316" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#070a11" stop-opacity="0" />
    </radialGradient>

    <!-- Tech Gradients -->
    <linearGradient id="neonOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a18" />
      <stop offset="100%" stop-color="#e52e71" />
    </linearGradient>

    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="plateGradTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="plateGradMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.75" />
    </linearGradient>

    <linearGradient id="plateGradBottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0.95" />
    </linearGradient>

    <!-- Grid pattern -->
    <pattern id="isoGrid" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f97316" stroke-width="0.75" stroke-opacity="0.15" />
    </pattern>

    <!-- Glowing Filters -->
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="250" cy="250" r="230" fill="url(#coreGlow)" />
  <rect x="50" y="50" width="400" height="400" fill="url(#isoGrid)" opacity="0.6" rx="200" />

  <!-- Outer Orbit Rings -->
  <circle cx="250" cy="250" r="190" fill="none" stroke="rgba(234, 88, 12, 0.18)" stroke-width="1.5" stroke-dasharray="8 6" />
  <circle cx="250" cy="250" r="215" fill="none" stroke="rgba(56, 189, 248, 0.15)" stroke-width="1" stroke-dasharray="4 12" />

  <!-- Layer 3 (Bottom Layer - Zero-DDL Storage Base) -->
  <g transform="translate(0, 70)">
    <polygon points="250,220 390,290 250,360 110,290" fill="url(#plateGradBottom)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" />
    <polygon points="110,290 250,360 250,375 110,305" fill="#020617" opacity="0.8" />
    <polygon points="390,290 250,360 250,375 390,305" fill="#0b1120" opacity="0.9" />
    <!-- Storage Circuit Lines -->
    <path d="M 180,285 L 250,320 L 320,285" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" />
    <circle cx="180" cy="285" r="3" fill="#38bdf8" filter="url(#subtleGlow)" />
    <circle cx="250" cy="320" r="4" fill="#38bdf8" filter="url(#subtleGlow)" />
    <circle cx="320" cy="285" r="3" fill="#38bdf8" filter="url(#subtleGlow)" />
  </g>

  <!-- Conduits (Connecting Vertical Light Beams) -->
  <line x1="160" y1="290" x2="160" y2="210" stroke="url(#neonOrange)" stroke-width="2" stroke-dasharray="4 4" opacity="0.7" />
  <line x1="340" y1="290" x2="340" y2="210" stroke="url(#cyberCyan)" stroke-width="2" stroke-dasharray="4 4" opacity="0.7" />
  <line x1="250" y1="340" x2="250" y2="160" stroke="#f97316" stroke-width="2.5" opacity="0.8" filter="url(#subtleGlow)" />

  <!-- Layer 2 (Middle Layer - Multi-Tenant Router Engine) -->
  <g transform="translate(0, 0)">
    <polygon points="250,190 380,255 250,320 120,255" fill="url(#plateGradMid)" stroke="#f97316" stroke-width="2" stroke-opacity="0.7" filter="url(#subtleGlow)" />
    <polygon points="120,255 250,320 250,332 120,267" fill="#0f172a" opacity="0.9" />
    <polygon points="380,255 250,320 250,332 380,267" fill="#1e293b" opacity="0.9" />
    <!-- Tenant Nodes -->
    <g transform="translate(160, 245)">
      <rect x="-15" y="-8" width="30" height="16" rx="4" fill="#ea580c" opacity="0.8" />
      <circle cx="0" cy="0" r="3" fill="#ffffff" />
    </g>
    <g transform="translate(250, 280)">
      <rect x="-20" y="-10" width="40" height="20" rx="5" fill="#f97316" />
      <circle cx="0" cy="0" r="4" fill="#ffffff" filter="url(#subtleGlow)" />
    </g>
    <g transform="translate(340, 245)">
      <rect x="-15" y="-8" width="30" height="16" rx="4" fill="#0284c7" opacity="0.8" />
      <circle cx="0" cy="0" r="3" fill="#ffffff" />
    </g>
  </g>

  <!-- Layer 1 (Top Layer - Rust Core & Axum Hexagon Crystal) -->
  <g transform="translate(0, -65)">
    <polygon points="250,160 360,215 250,270 140,215" fill="url(#plateGradTop)" stroke="#fdba74" stroke-width="2" />
    <!-- Floating Glowing Monolith / Rust Core -->
    <g transform="translate(250, 195)">
      <!-- Glowing Core Cube -->
      <polygon points="0,-45 35,-25 35,20 0,40 -35,20 -35,-25" fill="url(#neonOrange)" filter="url(#neonBlur)" opacity="0.6" />
      <polygon points="0,-40 30,-22 30,16 0,34 -30,16 -30,-22" fill="#090d16" stroke="#f97316" stroke-width="2" />
      <polygon points="0,-40 30,-22 0,-4 -30,-22" fill="url(#neonOrange)" opacity="0.9" />
      <polygon points="-30,-22 0,-4 0,34 -30,16" fill="#c2410c" />
      <polygon points="30,-22 0,-4 0,34 30,16" fill="#ea580c" />
      <!-- Central Rust 'F' Monogram -->
      <path d="M -8,-15 L 12,-15 L 12,-9 L -2,-9 L -2,-3 L 8,-3 L 8,3 L -2,3 L -2,12 L -8,12 Z" fill="#ffffff" filter="url(#subtleGlow)" />
    </g>
  </g>

  <!-- Floating Particles & Orbiting Dots -->
  <circle cx="130" cy="150" r="3" fill="#38bdf8" filter="url(#subtleGlow)" />
  <circle cx="370" cy="140" r="4" fill="#fb923c" filter="url(#neonBlur)" />
  <circle cx="100" cy="270" r="2.5" fill="#f97316" />
  <circle cx="400" cy="260" r="3.5" fill="#38bdf8" filter="url(#subtleGlow)" />
  <circle cx="210" cy="80" r="2" fill="#fed7aa" />
  <circle cx="290" cy="75" r="3" fill="#38bdf8" filter="url(#subtleGlow)" />
</svg>
