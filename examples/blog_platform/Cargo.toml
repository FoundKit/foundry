[package]
name = "blog_platform"
version.workspace = true
edition = "2024"
authors = ["Blog Platform Team <dev@example.com>"]
license = "MIT OR Apache-2.0"
description = "Standalone Example Application built on top of the Foundry Framework"

[lints]
workspace = true

[features]
default = ["postgres"]
postgres = ["foundry/postgres"]
mysql = ["foundry/mysql"]

[dependencies]
foundry = { path = "../../crates/foundry", default-features = false, features = ["server", "storage", "auth", "extension"] }
tokio = { version = "1.44", features = ["macros", "rt-multi-thread"] }
serde = { version = "1.0", features = ["derive"] }
validator = { workspace = true, features = ["derive"] }
uuid = { version = "1.15", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { workspace = true }
axum = { workspace = true }
serde_json = "1.0"
sqlx = { workspace = true }
