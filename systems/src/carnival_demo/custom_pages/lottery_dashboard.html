<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>抽奖运营大屏 - Carnival Demo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#ecfdf5',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100 min-h-screen p-6 transition-colors duration-200">
  <div class="max-w-6xl mx-auto space-y-6">
    <!-- Header -->
    <div class="flex items-center justify-between border-b border-slate-200 dark:border-slate-800 pb-4">
      <div>
        <h1 class="text-2xl font-bold flex items-center gap-2">
          <span>🎁</span> 抽奖运营实时大屏
        </h1>
        <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">
          子系统专属自定义页面 · carnival_demo / lottery_dashboard
        </p>
      </div>
      <div class="flex items-center gap-3">
        <span id="status-badge" class="px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300">
          ● 桥接已连接
        </span>
        <button onclick="triggerToast()" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-semibold shadow-sm transition">
          发送通知到外壳
        </button>
      </div>
    </div>

    <!-- Stats Grid -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
      <div class="bg-white dark:bg-slate-800/80 p-5 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm">
        <div class="text-xs text-slate-500 dark:text-slate-400 font-medium">今日抽奖总人次</div>
        <div class="text-2xl font-bold text-slate-900 dark:text-white mt-2">128,420</div>
        <div class="text-[11px] text-emerald-500 mt-1">↑ 18.2% 较昨日</div>
      </div>
      <div class="bg-white dark:bg-slate-800/80 p-5 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm">
        <div class="text-xs text-slate-500 dark:text-slate-400 font-medium">特等奖发放数</div>
        <div class="text-2xl font-bold text-amber-500 mt-2">3 / 5</div>
        <div class="text-[11px] text-slate-400 mt-1">剩余 2 个特等奖</div>
      </div>
      <div class="bg-white dark:bg-slate-800/80 p-5 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm">
        <div class="text-xs text-slate-500 dark:text-slate-400 font-medium">综合中奖率</div>
        <div class="text-2xl font-bold text-emerald-600 dark:text-emerald-400 mt-2">32.4%</div>
        <div class="text-[11px] text-slate-400 mt-1">在风控预期范围内</div>
      </div>
      <div class="bg-white dark:bg-slate-800/80 p-5 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm">
        <div class="text-xs text-slate-500 dark:text-slate-400 font-medium">风控拦截频次</div>
        <div class="text-2xl font-bold text-rose-500 mt-2">1,402</div>
        <div class="text-[11px] text-rose-500 mt-1">已自动拉黑异常 IP</div>
      </div>
    </div>

    <!-- Live Test Call Section -->
    <div class="bg-white dark:bg-slate-800/80 p-6 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm space-y-4">
      <h2 class="text-base font-bold">🎯 测试调用子系统原生扩展 API</h2>
      <p class="text-xs text-slate-500 dark:text-slate-400">
        调用自身 Rust 扩展接口: <code class="font-mono text-emerald-600 dark:text-emerald-400">POST /api/v1/s/carnival_demo/ext/participate</code>
      </p>
      <div class="flex gap-3 max-w-md">
        <input id="test-nickname" type="text" value="Alice" placeholder="用户昵称" class="flex-1 px-3 py-2 text-xs rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:outline-none focus:ring-2 focus:ring-emerald-500">
        <input id="test-lucky-num" type="number" value="14" placeholder="幸运数字 (1-100)" class="w-32 px-3 py-2 text-xs rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:outline-none focus:ring-2 focus:ring-emerald-500">
        <button onclick="testParticipate()" class="px-4 py-2 bg-slate-900 dark:bg-emerald-600 hover:bg-slate-800 text-white rounded-lg text-xs font-semibold shadow transition">
          抽奖
        </button>
      </div>
      <div id="result-box" class="hidden p-3 rounded-lg bg-slate-100 dark:bg-slate-900 text-xs font-mono"></div>
    </div>

    <!-- Session Info -->
    <div class="bg-slate-100 dark:bg-slate-800/40 p-4 rounded-xl text-xs font-mono text-slate-600 dark:text-slate-400 space-y-1">
      <div><strong>Bridge 上下文信息:</strong></div>
      <div id="bridge-info">等待 Foundry Admin 注入凭据...</div>
    </div>
  </div>

  <script>
    let authContext = null;

    // Listen for Foundry Admin initialization postMessage
    window.addEventListener('message', function(event) {
      if (!event.data || typeof event.data !== 'object') return;
      if (event.data.type === 'FOUNDRY_INIT') {
        authContext = event.data.payload;
        
        // Sync theme
        if (authContext.theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }

        document.getElementById('bridge-info').innerHTML = `
          <div>Admin: <span class="text-emerald-500">${authContext.admin?.username || 'unknown'}</span> (${authContext.admin?.role || 'admin'})</div>
          <div>Subsystem: <span class="text-emerald-500">${authContext.subsystemSlug}</span></div>
          <div>JWT: <span class="text-slate-400">${authContext.token ? authContext.token.substring(0, 24) + '...' : 'none'}</span></div>
        `;
      }
    });

    function triggerToast() {
      window.parent.postMessage({
        type: 'FOUNDRY_TOAST',
        payload: {
          message: '来自抽奖大屏的实时消息：奖池水位正常！',
          level: 'success'
        }
      }, '*');
    }

    async function testParticipate() {
      const nickname = document.getElementById('test-nickname').value;
      const lucky_number = parseInt(document.getElementById('test-lucky-num').value, 10);
      const resBox = document.getElementById('result-box');
      resBox.classList.remove('hidden');
      resBox.innerText = '请求中...';

      try {
        const headers = { 'Content-Type': 'application/json' };
        if (authContext?.token) {
          headers['Authorization'] = `Bearer ${authContext.token}`;
        }
        const resp = await fetch('/api/v1/s/carnival_demo/ext/participate', {
          method: 'POST',
          headers,
          body: JSON.stringify({ nickname, lucky_number })
        });
        const data = await resp.json();
        resBox.innerText = JSON.stringify(data, null, 2);
      } catch (err) {
        resBox.innerText = '请求失败: ' + err.message;
      }
    }
  </script>
</body>
</html>
