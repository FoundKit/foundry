<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>转盘概率调控 - Carnival Demo</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100 min-h-screen p-6 transition-colors duration-200">
  <div class="max-w-4xl mx-auto space-y-6">
    <div class="border-b border-slate-200 dark:border-slate-800 pb-4">
      <h1 class="text-2xl font-bold flex items-center gap-2">
        <span>✨</span> 转盘概率实时调控面板
      </h1>
      <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">
        高权限操作 · 仅限 super_admin 访问
      </p>
    </div>

    <div class="bg-white dark:bg-slate-800/80 p-6 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm space-y-4">
      <div class="space-y-4">
        <div>
          <label class="text-xs font-semibold">一等奖爆率基数 (当前: 0.5%)</label>
          <input type="range" min="1" max="100" value="5" class="w-full mt-2">
        </div>
        <div>
          <label class="text-xs font-semibold">二等奖爆率基数 (当前: 3.0%)</label>
          <input type="range" min="1" max="100" value="30" class="w-full mt-2">
        </div>
        <div>
          <label class="text-xs font-semibold">保底触发人次阈值</label>
          <input type="number" value="50" class="w-full mt-1 px-3 py-2 text-xs rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900">
        </div>
      </div>
      <button class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-semibold shadow transition">
        保存并热生效
      </button>
    </div>
  </div>

  <script>
    window.addEventListener('message', function(event) {
      if (event.data?.type === 'FOUNDRY_INIT') {
        if (event.data.payload.theme === 'dark') {
          document.documentElement.classList.add('dark');
        }
      }
    });
  </script>
</body>
</html>
